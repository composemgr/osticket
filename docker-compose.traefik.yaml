name: osticket
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  server:
    image: osticket/osticket:latest
    container_name: osticket-server
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: osticket-server
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      # Database
      MYSQL_HOST: osticket-db
      MYSQL_DATABASE: ${DB_CREATE_DATABASE_NAME:-osticket}
      MYSQL_USER: ${DB_USER_NAME:-osticket}
      MYSQL_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MYSQL_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
      # Email
      SMTP_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      SMTP_PORT: ${EMAIL_SERVER_PORT:-587}
      SMTP_FROM: ${EMAIL_SERVER_MAIL_FROM:-no-reply@example.com}
      SMTP_USER: ${EMAIL_SERVER_LOGIN_NAME:-}
      SMTP_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      SMTP_TLS: "1"
      # Installer and admin account
      INSTALL_SECRET: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      INSTALL_EMAIL: ${EMAIL_SERVER_MAIL_FROM:-no-reply@example.com}
      INSTALL_NAME: ${APP_ORG_NAME:-Support Desk}
      ADMIN_USERNAME: ${APP_ADMIN_USER:-ostadmin}
      ADMIN_PASSWORD: ${APP_ADMIN_PASS:-changeme_admin_password}
    volumes:
      - './volumes/data/osticket:/data'
      - './volumes/config/osticket:/var/www/html/upload/include'
    depends_on:
      db:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.osticket-server.entrypoints=http'
      - 'traefik.http.routers.osticket-server.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.osticket-server.middlewares=osticket-server-https-redirect'
      - 'traefik.http.middlewares.osticket-server-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.osticket-server-secure.entrypoints=https'
      - 'traefik.http.routers.osticket-server-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.osticket-server-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.osticket-server-secure.service=osticket-server'
      - 'traefik.http.services.osticket-server.loadbalancer.server.port=80'
    networks:
      - osticket
      - traefik

  db:
    image: mariadb:latest
    container_name: osticket-db
    hostname: osticket-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: osticket-db
      MARIADB_DATABASE: ${DB_CREATE_DATABASE_NAME:-osticket}
      MARIADB_USER: ${DB_USER_NAME:-osticket}
      MARIADB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MARIADB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
    volumes:
      - './volumes/db/mariadb/osticket:/var/lib/mysql:z'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - osticket

networks:
  osticket:
    name: osticket
    external: false
  traefik:
    external: true
